<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ficha de Campo</title>
    <link rel="stylesheet" href="css/style.css" />

    <style>
      body {
        background: white;
        color: #000;
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .ficha {
        max-width: 800px;
        margin: auto;
        font-size: 13pt;
        line-height: 1.3;
      }

      h1,
      h2 {
        color: #000;
      }

      h1 {
        font-size: 26pt;
      }

      h2 {
        font-size: 19pt;
      }

      h3 {
        font-size: 15pt;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 10px 0 20px;
        font-size: 10.5pt;
        line-height: 1.25;
      }

      th,
      td {
        border: 1px solid #333;
        padding: 6px;
        text-align: left;
        overflow-wrap: anywhere;
      }

      .linha {
        margin-bottom: 6px;
        font-size: 11pt;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .assinaturas {
        display: flex;
        justify-content: space-between;
        margin-top: 60px;
      }

      .assinatura {
        width: 45%;
        text-align: center;
        border-top: 1px solid #000;
        padding-top: 8px;
      }

      .no-print {
        margin-bottom: 20px;
      }

      @media print {
        @page {
          size: A4;
        }

        .no-print {
          display: none;
        }

        body {
          padding: 0;
        }

        h1,
        h2,
        h3 {
          break-after: avoid;
        }

        tr,
        .linha,
        li,
        .assinaturas {
          break-inside: avoid;
        }

        thead {
          display: table-header-group;
        }
      }
    </style>
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon_48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  </head>
  <body>
    <div class="no-print">
      <button onclick="window.print()">Imprimir / Salvar PDF</button>
      <button onclick="history.back()">Voltar</button>
    </div>

    <div class="ficha" id="fichaContainer"></div>

    <script src="js/db-local.js"></script>
    <script src="js/ficha-impressao.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
