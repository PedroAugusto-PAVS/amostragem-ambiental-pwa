<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu Geral</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <div class="page-title">
        <h1>Menu Geral</h1>
        <p>Acesse todas as funções do aplicativo</p>
      </div>

      <section class="card">
        <strong>Cadastros</strong>

        <br /><br />

        <button class="btn-blue" onclick="abrir('projetos.html')">
          Projetos
        </button>
        <br /><br />
        <button class="btn-blue" onclick="abrir('novo-projeto.html')">
          Adicionar Projeto
        </button>
        <br /><br />
        <button class="btn-blue" onclick="abrir('novo-poco.html')">
          Adicionar PM / Poço
        </button>
        <br /><br />
        <button class="btn-blue" onclick="abrir('campanhas.html')">
          Campanhas
        </button>
        <br /><br />
        <button class="btn-blue" onclick="abrir('nova-campanha.html')">
          Adicionar Campanha
        </button>
        <br /><br />
      </section>

      <section class="card">
        <strong>Operação de Campo</strong>

        <br /><br />

        <button class="btn-blue" onclick="abrir('dashboard.html')">
          Dashboard / PMs
        </button>
        <br /><br />
        <button class="btn-blue" onclick="abrir('medicoes.html')">
          Medições
        </button>
        <br /><br />
        <button class="btn-blue" onclick="abrir('mapa.html')">Mapa</button>
        <br /><br />
      </section>

      <section class="card">
        <strong>Sistema</strong>

        <br /><br />

        <button class="btn-blue" onclick="abrir('configuracoes.html')">
          Configurações
        </button>
        <br /><br />
        <button class="btn-blue" onclick="abrir('admin.html')">
          Administração
        </button>
        <br /><br />
        <button class="btn-blue" style="background: #ef4444" onclick="sair()">
          Sair
        </button>
        <br /><br />
      </section>
    </main>

    <nav class="bottom-nav">
      <a class="active" href="menu.html"><span>☰</span>Menu</a>
      <a href="dashboard.html"><span>⌂</span>Poços</a>
      <a href="projetos.html"><span>▦</span>Projetos</a>
      <a href="campanhas.html"><span>📋</span>Campanhas</a>
      <a href="configuracoes.html"><span>⚙</span>Config.</a>
    </nav>

    <script>
      const usuario = JSON.parse(localStorage.getItem("usuario"));

      if (!usuario) {
        window.location.href = "index.html";
      }

      function abrir(pagina) {
        window.location.href = pagina;
      }

      function sair() {
        localStorage.removeItem("usuario");
        window.location.href = "index.html";
      }
    </script>
    <script src="js/theme.js"></script>
  </body>
</html>
