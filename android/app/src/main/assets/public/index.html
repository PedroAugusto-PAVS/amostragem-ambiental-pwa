<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Poços Subterrâneos</title>

<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">

</head>
<body class="login-page">

<div class="login-card-modern">

  <div class="logo">
    💧
  </div>

  <h1>
    Poços<br>
    Subterrâneos
  </h1>

  <p>
    Sistema de Amostragem Ambiental
  </p>

  <form id="loginForm">

    <div class="input-icon">
      <input
        type="email"
        id="email"
        placeholder="E-mail"
        required
      >
    </div>

    <div class="input-icon">
      <input
        type="password"
        id="password"
        placeholder="Senha"
        required
      >
    </div>

    <button
      type="submit"
      class="btn-primary"
    >
      Entrar
    </button>

  </form>

  <br>

  <button
    class="btn-blue"
    onclick="entrarOffline()"
  >
    Entrar Offline
  </button>

  <br><br>

  <p id="loginMessage"></p>

</div>

<script>
function entrarOffline(){
  window.location.href =
  "dashboard.html";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
