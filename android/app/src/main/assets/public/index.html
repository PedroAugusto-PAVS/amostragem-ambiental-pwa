<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>HydroTrack</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon_48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  </head>
  <body class="login-page">
    <div id="hydrotrack-splash" class="hydrotrack-splash">
      <img
        src="icons/splash.png"
        alt="HydroTrack"
        class="hydrotrack-splash-image"
      />
    </div>

    <div class="login-card-modern">
      <div class="logo">
        <img src="icons/splash_logo.png" class="logo-login" alt="HydroTrack" />
      </div>

      <h1>HydroTrack</h1>

      <p>Sistema de Monitoramento de Poços e Águas Subterrâneas</p>

      <form id="loginForm">
        <div class="input-icon">
          <input type="email" id="email" placeholder="E-mail" aria-label="E-mail" required />
        </div>

        <div class="input-icon">
          <input type="password" id="password" placeholder="Senha" aria-label="Senha" required />
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
      </form>

      <br />

      <button class="btn-blue" onclick="entrarOffline()">Entrar Offline</button>

      <br /><br />

      <p id="loginMessage"></p>
    </div>

    <script>
      function entrarOffline() {
        const usuarioSalvo = JSON.parse(
          localStorage.getItem("usuario") || "null"
        );

        if (!usuarioSalvo) {
          document.getElementById("loginMessage").innerText =
            "Entre ao menos uma vez com internet antes de usar o modo offline.";
          return;
        }

        window.location.href = "dashboard.html";
      }
    </script>

    <script>
      window.addEventListener("load", function () {
        const splash = document.getElementById("hydrotrack-splash");

        if (!splash) {
          return;
        }

        setTimeout(function () {
          splash.classList.add("is-hidden");

          setTimeout(function () {
            splash.remove();
          }, 500);
        }, 1800);
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const splash = document.getElementById("hydrotrack-splash");
    
        if (!splash) return;
    
        setTimeout(() => {
          splash.classList.add("is-hidden");
    
          setTimeout(() => {
            splash.remove();
          }, 450);
        }, 1800);
      });
    </script>
  </body>
</html>
