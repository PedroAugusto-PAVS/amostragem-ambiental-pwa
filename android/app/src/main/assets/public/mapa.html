<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Poços</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon_48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <body>
    <main class="container">
      <button class="back-btn" onclick="history.back()">← Voltar</button>

      <div class="page-title">
        <h1>Mapa</h1>
        <p>PMs com localização GPS cadastrada</p>
      </div>

      <section class="card">
        <input
          type="text"
          id="pesquisaMapa"
          placeholder="Pesquisar PM..."
          aria-label="Pesquisar PM no mapa"
          oninput="filtrarMapa()"
        />
      </section>

      <section id="listaMapa" class="content-list"></section>
    </main>

    <nav class="bottom-nav">

      <a href="configuracoes.html"><span>⚙</span>Config.</a>
    </nav>

    <script src="js/mapa.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
