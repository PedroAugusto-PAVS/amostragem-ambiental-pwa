<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalhe da Campanha</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon_48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  </head>
  <body>
    <main class="container">
      <button class="back-btn" onclick="history.back()">← Voltar</button>

      <div class="page-title">
        <h1 id="tituloCampanha">Campanha</h1>
        <p id="subtituloCampanha">Controle de coleta</p>
      </div>

      <section id="resumoCampanha"></section>

      <div class="card-actions">
        <button class="btn-blue" onclick="editarCampanha()">Editar</button>
        <button
          class="btn-blue"
          id="btnStatusCampanha"
          onclick="alternarStatusCampanha()"
        >
          Inativar
        </button>
      </div>

      <br />

      <button
        class="btn-danger"
        onclick="excluirCampanha()"
      >
        Excluir Campanha
      </button>

      <section class="dashboard-list-panel campaign-pm-panel">
        <div class="dashboard-list-header">
          <div>
            <h2>PMs da campanha</h2>
            <p id="resumoListaPmsCampanha">Carregando lista...</p>
          </div>
        </div>

        <div class="dashboard-search">
          <input
            type="text"
            id="pesquisaPmCampanha"
            placeholder="Pesquisar por nome, local ou tipo..."
            aria-label="Pesquisar PM na campanha"
            oninput="filtrarPmsCampanha()"
          />
        </div>

        <section id="listaPmsCampanha" class="pms-list"></section>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="menu.html"><span>☰</span>Menu</a>
      <a href="dashboard.html"><span>⌂</span>PMs</a>
      <a href="projetos.html"><span>▦</span>Projetos</a>
      <a href="campanhas.html" class="active"><span>▣</span>Campanhas</a>
      <a href="configuracoes.html"><span>⚙</span>Config.</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db-local.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/campanha-detalhe.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
