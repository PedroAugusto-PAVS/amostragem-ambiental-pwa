  <head>
    <meta charset="UTF-8" />

    <title>Editar Projeto</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <button class="back-btn" onclick="history.back()">← Voltar</button>

      <div class="page-title">
        <h1>Editar Projeto</h1>
        <p>Atualize os dados do projeto</p>
      </div>

      <form class="form-card">
        <label>Nome do projeto *</label>
        <input id="nomeProjeto" />

        <label>Cliente</label>
        <input id="clienteProjeto" />

        <label>Processo Comercial</label>
        <input id="processoComercial" placeholder="Ex.: PC-000123" />

        <label>Local</label>
        <input id="localProjeto" />

        <label>Descrição</label>
        <textarea id="descricaoProjeto"></textarea>

        <br /><br />

        <button type="button" class="btn-blue" onclick="salvarEdicaoProjeto()">
          Salvar alterações
        </button>
      </form>
    </main>

    <nav class="bottom-nav">
