<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container">

  <button class="back-btn" onclick="history.back()">← Voltar</button>

  <div class="page-title">
    <h1>Painel Admin</h1>
    <p>Gerencie coletores e administradores</p>
  </div>

  <section class="card stats">
    <div>
      <strong id="totalUsuarios">0</strong>
      <span>Usuários</span>
    </div>

    <div>
      <strong id="totalColetores">0</strong>
      <span>Coletores</span>
    </div>

    <div>
      <strong id="totalAdmins">0</strong>
      <span>Admins</span>
    </div>
  </section>

  <h3 class="section-title">Cadastrar / Editar Usuário</h3>

  <form class="form-card">

    <input type="hidden" id="usuarioIdEdicao">

    <label>Nome</label>
    <input id="nomeUsuario" placeholder="Nome completo">

    <label>Email</label>
    <input id="emailUsuario" type="email" placeholder="email@empresa.com">

    <label>Senha</label>
    <input id="senhaUsuario" type="password" placeholder="Senha inicial">

    <label>Tipo</label>
    <select id="tipoUsuario">
      <option value="coletor">Coletor</option>
      <option value="admin">Administrador</option>
    </select>

    <label>Status</label>
    <select id="statusUsuario">
      <option value="true">Ativo</option>
      <option value="false">Inativo</option>
    </select>

    <button type="button" class="btn-blue" onclick="salvarUsuarioAdmin()">
      Salvar usuário
    </button>

    <br><br>

    <button type="button" class="btn-primary" onclick="limparFormularioUsuario()">
      Limpar formulário
    </button>

  </form>

  <h3 class="section-title">Usuários cadastrados</h3>

  <section id="listaUsuarios"></section>

</main>

<nav class="bottom-nav">
  <a href="dashboard.html"><span>⌂</span>Poços</a>
  <a href="projetos.html"><span>▦</span>Projetos</a>
  <a href="campanhas.html"><span>📋</span>Campanhas</a>
  <a href="medicoes.html"><span>▣</span>Medições</a>
  <a class="active" href="admin.html"><span>⚙</span>Admin</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db-local.js"></script>
<script src="js/supabase.js"></script>
<script src="js/sync.js"></script>
<script src="js/admin.js"></script>

</body>
</html>
