<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duplicar Medição</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container">

  <button class="back-btn" onclick="history.back()">← Voltar</button>

  <div class="page-title">
    <h1>Duplicar Medição</h1>
    <p id="nomePocoSelecionado">Poço selecionado</p>
  </div>

  <section class="card">
    <strong>Como funciona?</strong>
    <p>
      Escolha uma medição já cadastrada e informe o novo mês. 
      O sistema vai copiar as leituras, condições e dados como base.
    </p>
  </section>

  <form class="form-card">

    <label>Medição de origem</label>
    <select id="medicaoOrigem">
      <option value="">Selecione uma medição</option>
    </select>

    <label>Nova data da medição</label>
    <input type="date" id="novaDataMedicao">

    <label>Novo mês de referência</label>
    <input type="month" id="novoMesReferencia">

    <br><br>

    <button type="button" class="btn-blue" onclick="duplicarMedicao()">
      Duplicar Medição
    </button>

  </form>

</main>

</body>
</html>
