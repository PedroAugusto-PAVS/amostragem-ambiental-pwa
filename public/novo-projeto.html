<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Projeto</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container">

  <button class="back-btn" onclick="history.back()">← Voltar</button>

  <div class="page-title">
    <h1>Novo Projeto</h1>
    <p>Cadastre um cliente, contrato ou área</p>
  </div>

  <form class="form-card">

    <label>Nome do projeto *</label>
    <input id="nomeProjeto" placeholder="Ex.: Monitoramento Fazenda Boa Vista">

    <label>Cliente</label>
    <input id="clienteProjeto" placeholder="Ex.: Cliente / Empresa">

    <label>Local</label>
    <input id="localProjeto" placeholder="Ex.: Uruaçu - GO">

    <label>Descrição</label>
    <textarea id="descricaoProjeto" placeholder="Observações sobre o projeto"></textarea>

    <br><br>

    <button type="button" class="btn-blue" onclick="salvarProjeto()">
      Salvar Projeto
    </button>

  </form>

</main>
