<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Campanha</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <button class="back-btn" onclick="history.back()">← Voltar</button>

      <div class="page-title">
        <h1>Nova Campanha</h1>
        <p>Crie uma campanha de coleta mensal</p>
      </div>

      <form class="form-card">
        <label>Projeto *</label>
        <select id="projetoSelect">
          <option value="">Selecione</option>
        </select>

        <label>Nome da campanha *</label>
        <input id="nomeCampanha" placeholder="Ex.: Campanha Junho/2026" />

        <label>Mês referência</label>
        <input type="month" id="mesReferencia" />

        <div class="grid">
          <div>
            <label>Data início</label>
            <input type="date" id="dataInicio" />
          </div>

          <div>
            <label>Data fim</label>
            <input type="date" id="dataFim" />
          </div>
        </div>

        <label>Observações</label>
        <textarea id="observacoes"></textarea>

        <br />

        <button type="button" class="btn-blue" onclick="salvarCampanha()">
          Salvar Campanha
        </button>
      </form>
    </main>

    <nav class="bottom-nav">
      <a href="menu.html"><span>☰</span>Menu</a>
      <a href="dashboard.html"><span>⌂</span>Poços</a>
      <a href="projetos.html"><span>▦</span>Projetos</a>
      <a href="campanhas.html"><span>📋</span>Campanhas</a>
      <a href="configuracoes.html"><span>⚙</span>Config.</a>
    </nav>

    <script src="js/db-local.js"></script>
    <script src="js/nova-campanha.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
