<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus PMs</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon_48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  </head>
  <body class="page-dashboard">
    <main class="container">
      <section class="dashboard-hero">
        <div>
          <span class="dashboard-kicker">Monitoramento</span>
          <h1>Meus PMs</h1>
          <p>Resumo das coletas e acesso rapido ao historico de cada ponto.</p>
        </div>

        <button
          class="dashboard-add-btn"
          onclick="window.location.href='novo-poco.html'"
        >
          + Novo PM
        </button>
      </section>

      <section class="dashboard-stats">
        <div class="dashboard-stat-card">
          <strong id="totalPocos">0</strong>
          <span>PMs ativos</span>
        </div>

        <div class="dashboard-stat-card">
          <strong id="totalMedicoes">0</strong>
          <span>medicoes</span>
        </div>

        <div class="dashboard-stat-card">
          <strong id="totalPendentes">0</strong>
          <span>pendentes</span>
        </div>
      </section>

      <section class="dashboard-list-panel">
        <div class="dashboard-list-header">
          <div>
            <h2>PMs cadastrados</h2>
            <p id="resumoListaPocos">Carregando lista...</p>
          </div>
        </div>

        <div class="dashboard-search">
          <input
            type="text"
            id="pesquisaPoco"
            placeholder="Pesquisar por nome, local ou tipo..."
            oninput="filtrarPocos()"
          />
        </div>

        <section id="listaPocos" class="pms-list"></section>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="menu.html"><span>☰</span>Menu</a>
      <a href="dashboard.html" class="active"><span>⌂</span>PMs</a>
      <a href="projetos.html"><span>▦</span>Projetos</a>
      <a href="campanhas.html"><span>📋</span>Campanhas</a>
      <a href="configuracoes.html"><span>⚙</span>Config.</a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/db-local.js"></script>
    <script src="js/dashboard-lista.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
