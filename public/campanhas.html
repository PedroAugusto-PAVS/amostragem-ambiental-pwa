<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campanhas</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" sizes="48x48" href="icons/icon_48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  </head>
  <body>
    <main class="container">
      <button class="back-btn" onclick="history.back()">← Voltar</button>

      <div class="page-title">
        <h1>Campanhas</h1>
        <p>Controle mensal das coletas</p>
      </div>

      <section class="card campaign-filters" aria-label="Filtros de campanhas">
        <label for="filtroProjetoCampanha">Projeto</label>
        <select id="filtroProjetoCampanha">
          <option value="">Todos os projetos</option>
        </select>

        <div class="campaign-filter-grid">
          <div>
            <label for="filtroMesCampanha">Mês</label>
            <input type="month" id="filtroMesCampanha" />
          </div>

          <div>
            <label for="filtroSituacaoCampanha">Situação</label>
            <select id="filtroSituacaoCampanha">
              <option value="">Todas</option>
              <option value="concluida">Concluídas</option>
              <option value="pendente">Pendentes</option>
            </select>
          </div>
        </div>

        <button type="button" id="limparFiltrosCampanha" class="btn-secondary campaign-filter-clear">
          Limpar filtros
        </button>
      </section>

      <section id="listaCampanhas" class="content-list"></section>
    </main>

    <button
      class="float-btn"
      onclick="window.location.href='nova-campanha.html'"
    >
      +
    </button>

    <nav class="bottom-nav">
      <a href="menu.html"><span>☰</span>Menu</a>
      <a href="dashboard.html"><span>⌂</span>Poços</a>
      <a href="projetos.html"><span>▦</span>Projetos</a>
      <a href="campanhas.html" class="active"><span>📋</span>Campanhas</a>
      <a href="configuracoes.html"><span>⚙</span>Config.</a>
    </nav>

    <script src="js/db-local.js"></script>
    <script src="js/campanhas.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
