<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar PM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container">

  <button class="back-btn" onclick="history.back()">← Voltar</button>

  <div class="page-title">
    <h1>Editar PM</h1>
    <p>Atualize os dados do ponto fixo</p>
  </div>

  <form class="form-card">

    <label>Projeto</label>
    <select id="projetoSelect">
      <option value="">Sem projeto</option>
    </select>

    <label>Nome do poço *</label>
    <input id="nomePoco">

    <label>Tipo do ponto *</label>
    <select id="tipoPoco">
      <option value="">Selecione</option>
      <option value="PM">PM - Poço de Monitoramento</option>
      <option value="PJ">PJ</option>
      <option value="POCO_PRODUCAO">Poço de Produção</option>
    </select>

    <label>Local / Propriedade</label>
    <input id="localPropriedade">

    <div class="grid">
      <div>
        <label>UTM E</label>
        <input id="utmE">
      </div>

      <div>
        <label>UTM N</label>
        <input id="utmN">
      </div>
    </div>

    <div class="grid">
      <div>
        <label>Latitude</label>
        <input id="latitudeGps">
      </div>

      <div>
        <label>Longitude</label>
        <input id="longitudeGps">
      </div>
    </div>

    <button type="button" class="btn-primary" onclick="capturarGPS()">
      Atualizar GPS
    </button>

    <label>Profundidade total do poço (m)</label>
    <input type="number" step="0.01" id="profundidadeTotal">

    <label>Diâmetro do poço</label>
    <select id="diametro">
      <option value="">Selecione</option>
      <option value="5">5 cm - Área 2.03</option>
      <option value="2.5">2,5 cm - Área 0.51</option>
    </select>

    <br><br>

    <button type="button" class="btn-blue" onclick="salvarEdicaoPoco()">
      Salvar alterações
    </button>

  </form>

</main>

<nav class="bottom-nav">
  <a href="dashboard.html"><span>⌂</span>Poços</a>
  <a href="projetos.html"><span>▦</span>Projetos</a>
  <a href="novo-poco.html"><span>＋</span>Adicionar</a>
  <a href="medicoes.html"><span>▣</span>Medições</a>
  <a href="configuracoes.html"><span>⚙</span>Config.</a>
</nav>

<script src="js/db-local.js"></script>
<script src="js/editar-poco.js"></script>

</body>
</html>
